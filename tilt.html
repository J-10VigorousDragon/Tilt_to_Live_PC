<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilt to Live — 鼠标版</title>
<style>
  /* ============================================================
     页面布局：canvas 铺满整个窗口，菜单/结算面板用透明覆盖层
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060a24;
               font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #game { position: fixed; inset: 0; display: block; cursor: crosshair; }

  /* 半透明覆盖层（菜单 / 结算），居中一张卡片 */
  .overlay {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(4, 6, 24, 0.45); z-index: 10;
  }
  .card {
    text-align: center; color: #e8ecff;
    padding: 44px 56px; border-radius: 18px;
    background: rgba(10, 16, 48, 0.88);
    border: 1px solid rgba(120, 160, 255, 0.35);
    box-shadow: 0 0 60px rgba(30, 60, 200, 0.35);
    max-width: 520px;
  }
  .card h1 {
    font-size: 44px; letter-spacing: 6px; margin-bottom: 6px;
    background: linear-gradient(180deg, #ffffff, #9db8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(120, 170, 255, 0.5);
  }
  .card .sub { color: #8fa3e0; font-size: 14px; margin-bottom: 26px; letter-spacing: 2px; }
  .card .info { color: #b9c6f5; font-size: 15px; line-height: 1.9; margin-bottom: 26px; }
  .card .info b { color: #ff9d9d; }
  .card .info .g { color: #8dfc9a; }
  .btn {
    display: inline-block; padding: 13px 44px; font-size: 18px; letter-spacing: 4px;
    color: #fff; background: linear-gradient(180deg, #3a6bff, #2244bb);
    border: 1px solid rgba(150, 180, 255, 0.6); border-radius: 30px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 26px rgba(80, 130, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .hiscore { color: #ffd98a; font-size: 15px; margin-top: 18px; }
  .achievement { color: #ffb45c; font-size: 15px; margin-top: 12px; line-height: 1.7; }

  /* 左上角音量按钮（常驻） */
  #muteBtn {
    position: fixed; top: 12px; left: 14px; z-index: 20;
    background: rgba(20, 30, 80, 0.6); border: 1px solid rgba(140, 170, 255, 0.4);
    color: #cfe0ff; border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer;
  }
  #muteBtn:hover { background: rgba(40, 60, 130, 0.8); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<button id="muteBtn" title="静音 / 取消静音 (M)">🔊</button>

<!-- 开始菜单 -->
<div class="overlay" id="menu">
  <div class="card">
    <h1>TILT TO LIVE</h1>
    <div class="sub">鼠标版 · 致敬 2010 年 One Man Left 经典</div>
    <div class="info">
      <b>红点</b>是敌人，碰到就死<br>
      <span class="g">绿点</span>是分数，攒够还能解锁武器<br>
      ⚡ 收集 <b>武器球</b>，把红点炸个精光！<br>
      <br>
      🖱 <b>操作：移动鼠标控制箭头方向</b><br>
      箭头会"滑"向鼠标 —— 这就是倾斜手感<br>
      <span style="color:#8fa3e0;font-size:13px">R 重新开始 · P 暂停 · M 静音</span>
    </div>
    <div class="btn" id="startBtn">开 始 游 戏</div>
    <div class="hiscore" id="menuHis"></div>
  </div>
</div>

<!-- 结算面板 -->
<div class="overlay hidden" id="gameover">
  <div class="card">
    <h1 style="font-size:34px">GAME OVER</h1>
    <div class="info" style="font-size:22px;margin-top:16px">
      本局得分：<b id="finalScore" style="color:#ffd98a;font-size:30px">0</b>
      <div style="font-size:14px;color:#8fa3e0;margin-top:8px">
        生存 <span id="finalTime">0:00</span> · 最大连击 <span id="finalCombo">x0</span> · 收集绿点 <span id="finalGreens">0</span>
      </div>
    </div>
    <div class="hiscore" id="finalHis"></div>
    <div class="achievement" id="finalAch"></div>
    <div class="btn" id="retryBtn" style="margin-top:24px">再 来 一 局</div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Tilt to Live 鼠标版 —— 单文件游戏
   玩法参考 2010 年 One Man Left 的经典 iOS 游戏（Fandom Wiki 资料）
   控制：鼠标 = 倾斜方向，箭头带着惯性"滑"向鼠标
   ============================================================ */

// ---------------- 配置（想调手感/难度就改这里） ----------------
const CFG = {
  // 玩家物理
  playerAccel: 1750,        // 加速度 px/s²（朝鼠标方向）
  playerMaxSpeed: 430,      // 最高速度 px/s
  playerDamping: 0.9,       // 速度阻尼（越大滑行越短）
  playerRadius: 9,          // 碰撞判定半径（故意偏小，还原原版宽容判定）
  mouseStopDist: 60,        // 距离鼠标多近开始"刹车"停下
  // 红点敌人
  dotRadius: 11,
  fastDotRadius: 7,
  bigDotRadius: 17,
  dotSpeedBase: 115,        // 初始速度
  dotSpeedRamp: 0.45,       // 每秒加速
  dotSpeedMax: 180,
  fastDotSpeed: 210,        // 快速小红点
  bigDotSpeed: 62,          // 慢速大灰点
  spawnRateBase: 0.9,       // 初始生成率（个/秒）
  spawnRateRamp: 0.045,     // 每秒增加
  spawnRateMax: 6.5,
  fastDotAt: 40,            // 第 40 秒起出现快红点
  bigDotAt: 80,             // 第 80 秒起出现大灰点
  maxDots: 450,             // 场上红点上限（防卡顿）
  // 绿点（分数 + 武器解锁货币）
  greenTarget: 15,          // 场上维持多少个绿点
  greenRadius: 5,
  greenCollectDist: 22,
  // 武器球 Orbs
  orbCount: 3,              // 同时在场数量（原版经典）
  orbRadius: 24,
  orbCollectDist: 36,
  // 连击
  comboWindow: 1.5,         // 连击窗口（秒），窗口内连续击杀维持连击
};

// 武器解锁门槛：累计收集多少个绿点解锁（数据参考 Fandom Wiki 的 award points）
const UNLOCKS = [
  { id: "ice",        need: 20,   name: "冰爆 Ice Blast",      desc: "冻住附近的红点，撞碎它们！" },
  { id: "bubble",     need: 40,   name: "泡泡护盾 Bubble Shield", desc: "碰到红点会爆炸的护盾，第二条命！" },
  { id: "vortex",     need: 70,   name: "漩涡 Vortex",         desc: "放置一个黑洞，吸走红点！" },
  { id: "spike",      need: 90,   name: "刺球 Spike Shield",   desc: "变成大刺球，红点吓得逃跑！" },
  { id: "lightning",  need: 120,  name: "闪电 Lightning",      desc: "连锁电击，一传十十传百！" },
  { id: "burnicade",  need: 240,  name: "烈焰战车 Burnicade",  desc: "冲刺留下一道火墙，+2000 分！" },
  { id: "turret",     need: 300,  name: "炮塔 Turret",         desc: "变成炮台，向鼠标方向扫射！" },
];

// 每种武器的具体参数（生成 orb 时使用）
const WEAPONS = {
  nuke:  { name: "核弹", color: "#ff8a3d", sym: "☢", points: 3 },
  wave:  { name: "冲击波", color: "#b57bff", sym: "≫", points: 5 },
  missiles: { name: "导弹", color: "#ff5d6c", sym: "➶", points: 10 },
  ice:   { name: "冰爆", color: "#7fd8ff", sym: "❄", points: 8 },
  bubble:{ name: "护盾", color: "#5dff9a", sym: "◌", points: 10 },
  vortex:{ name: "漩涡", color: "#8a5dff", sym: "◎", points: 10 },
  spike: { name: "刺球", color: "#4a6aff", sym: "✸", points: 10 },
  lightning:{ name: "闪电", color: "#e8e8ff", sym: "⚡", points: 6 },
  burnicade:{ name: "烈焰", color: "#ffb84d", sym: "🔥", points: 2000 },
  turret:{ name: "炮塔", color: "#5d9aff", sym: "◉", points: 3 },
};
const STARTER_ORBS = ["nuke", "wave", "missiles"];   // 初始就有的三种武器

// ---------------- 工具函数 ----------------
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

// ---------------- 画布与全局状态 ----------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;              // 画布尺寸
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const G = {   // 一局游戏的动态状态
  state: "menu",              // menu / playing / dying / over
  time: 0,                    // 本局存活秒数
  score: 0,
  greens: 0,                  // 本局收集绿点数（= 武器解锁货币）
  combo: 0,                   // 当前连击数
  comboBest: 0,
  comboTimer: 0,              // 连击剩余窗口
  nextWeapon: UNLOCKS[0],     // 下一个待解锁武器
  unlocked: new Set(STARTER_ORBS),
  shield: false,              // 泡泡护盾激活中？
  invincible: 0,              // 无敌剩余秒数（刺球/闪电/炮塔用）
  spikeT: 0,                  // 刺球剩余秒数
  lightningT: 0,              // 闪电剩余秒数
  turretT: 0,                 // 炮塔剩余秒数
  burnState: null,            // 烈焰冲刺：{t, aim} / {t, dir}
  waveCharge: 0,              // 冲击波蓄力
  freezeTime: 0,              // 全场慢动作（武器演出用）
  shake: 0,                   // 屏幕震动强度
  flash: 0,                   // 全屏白闪
  redFlash: 0,                // 死亡红闪
  dots: [], greensList: [], orbs: [],
  particles: [], rings: [], missiles: [], bullets: [], vortexes: [], walls: [],
  floats: [],                 // 飘字（得分提示）
  spawnAcc: 0,
  best: 0,
  turretFire: 0,       // 炮塔射击计时器
  lightningTick: 0,    // 闪电放电计时器
  redFlash: 0,         // 死亡红闪进度
  _lastDirX: 1, _lastDirY: 0,   // 鼠标移出窗口后保持的最后方向
};

// 玩家（箭头）
const P = { x: 0, y: 0, vx: 0, vy: 0 };
// 鼠标
const M = { x: -999, y: -999, active: false, dirX: 1, dirY: 0 };

// ---------------- 音效（Web Audio 合成，无需外部文件） ----------------
let audioCtx = null;
let muted = false;
try { muted = localStorage.getItem("ttl_muted") === "1"; } catch (e) { /* 忽略 */ }
function ac() {
  if (muted) return null;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
// 播放一个"音调 + 包络"的基础音
function tone(freq, dur, type = "sine", vol = 0.2, slideTo = null) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), c.currentTime + dur);
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.connect(g).connect(c.destination);
  o.start(); o.stop(c.currentTime + dur + 0.02);
}
// 播放一段噪声（爆炸/冲击）
function noise(dur, vol = 0.25, freq = 1000) {
  const c = ac(); if (!c) return;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(c.destination); src.start();
}
const SFX = {
  green()  { tone(880, 0.07, "square", 0.10); tone(1320, 0.09, "square", 0.07); },
  kill()   { tone(300, 0.06, "triangle", 0.10, 180); },
  nuke()   { noise(0.5, 0.35, 600); tone(120, 0.5, "sine", 0.35, 40); },
  ice()    { tone(1400, 0.35, "sine", 0.16, 300); noise(0.25, 0.12, 4000); },
  bubble() { tone(520, 0.2, "sine", 0.18, 900); },
  wave()   { tone(200, 0.4, "sawtooth", 0.15, 700); noise(0.3, 0.15, 900); },
  missiles(){ tone(700, 0.25, "sawtooth", 0.10, 300); noise(0.3, 0.12, 2500); },
  spike()  { noise(0.4, 0.2, 300); tone(90, 0.4, "square", 0.2, 55); },
  vortex() { tone(90, 0.8, "sine", 0.22, 40); },
  lightning(){ noise(0.25, 0.2, 6000); tone(2000, 0.3, "sawtooth", 0.1, 200); },
  burn()   { noise(0.6, 0.3, 400); tone(60, 0.6, "sawtooth", 0.25, 30); },
  turret() { tone(500, 0.05, "square", 0.08, 420); },
  unlock() { tone(523, 0.12, "square", 0.15); setTimeout(() => tone(659, 0.12, "square", 0.15), 120); setTimeout(() => tone(784, 0.2, "square", 0.15), 240); },
  death()  { tone(400, 0.7, "sawtooth", 0.3, 60); noise(0.6, 0.3, 800); },
  combo()  { tone(660, 0.08, "triangle", 0.12, 990); },
};

// ---------------- 粒子 / 冲击波 / 飘字（特效对象池） ----------------
function spawnParticle(x, y, vx, vy, life, color, size) {
  if (G.particles.length > 700) G.particles.shift();
  G.particles.push({ x, y, vx, vy, life, maxLife: life, color, size });
}
function burst(x, y, n, color, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(speed * 0.3, speed);
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.35, 0.8), color, rand(1.5, 3.5));
  }
}
function addRing(x, y, maxR, color, life = 0.5, width = 5) {
  G.rings.push({ x, y, r: 10, maxR, color, life, maxLife: life, width });
}
function addFloat(x, y, text, color = "#fff", size = 20) {
  G.floats.push({ x, y, text, color, size, life: 1.1, maxLife: 1.1 });
}

// ---------------- 实体：红点 / 绿点 / 武器球 ----------------
function spawnDot(type) {
  if (G.dots.length >= CFG.maxDots) return;
  const big = type === "big", fast = type === "fast";
  const r = big ? CFG.bigDotRadius : fast ? CFG.fastDotRadius : CFG.dotRadius;
  // 在屏幕四周 40px 宽的边缘带里随机生成
  const edge = rand(0, Math.PI * 2);
  const cx = W / 2, cy = H / 2, halfW = W / 2 + 30, halfH = H / 2 + 30;
  let x = cx + Math.cos(edge) * halfW, y = cy + Math.sin(edge) * halfH;
  x = clamp(x, 20, W - 20); y = clamp(y, 20, H - 20);
  G.dots.push({
    x, y, r, type,
    speed: big ? CFG.bigDotSpeed : fast ? CFG.fastDotSpeed
      : Math.min(CFG.dotSpeedBase + G.time * CFG.dotSpeedRamp, CFG.dotSpeedMax),
    frozen: 0,        // 冰冻剩余秒数（>0 时静止）
    shocked: 0,       // 被闪电电击的闪烁时间
    wobble: rand(0, 6.28),   // 追踪时的摆动相位
  });
}
function spawnGreen() {
  G.greensList.push({
    x: rand(50, W - 50), y: rand(50, H - 50),
    r: CFG.greenRadius, phase: rand(0, 6.28),
  });
}
function spawnOrb(weaponId) {
  G.orbs.push({
    id: weaponId,
    x: rand(80, W - 80), y: rand(80, H - 80),
    phase: rand(0, 6.28),
  });
}
// 从"已解锁"武器池里随机挑一个生成新 orb
function randomOrbId() {
  const pool = [...G.unlocked];
  return pool[randInt(0, pool.length - 1)];
}

// ---------------- 击杀红点（统一入口：加分、连击、特效） ----------------
function killDot(dot, cause) {
  const i = G.dots.indexOf(dot);
  if (i === -1) return;
  G.dots.splice(i, 1);
  // 连击
  G.combo++;
  G.comboBest = Math.max(G.comboBest, G.combo);
  G.comboTimer = CFG.comboWindow;
  if (G.combo > 1 && G.combo % 10 === 0) SFX.combo();
  // 击杀分（连击分在连击结束时一次性结算，原版规则 n×n×6）
  G.score += 10;
  const col = dot.frozen ? "#9fd8ff" : "#ff6b6b";
  burst(dot.x, dot.y, dot.frozen ? 8 : 10, col, 240);
  addFloat(dot.x, dot.y - 12, "+10", "#ffb4b4", 14);
  if (cause === "lightning") addRing(dot.x, dot.y, 70, "#ffe9a8", 0.3, 3);
  SFX.kill();
}

// ---------------- 武器逻辑 ----------------
function useWeapon(id) {
  const w = WEAPONS[id];
  G.score += w.points;                       // 使用武器的奖励分
  addFloat(P.x, P.y - 40, `+${w.points}`, w.color, 16);
  switch (id) {
    case "nuke": {   // 以玩家为中心的大爆炸
      G.shake = 22; G.flash = 0.5;
      addRing(P.x, P.y, 300, "#ffb45c");
      burst(P.x, P.y, 40, "#ffa54d", 420);
      SFX.nuke();
      for (const d of [...G.dots]) {
        if (dist2(d.x, d.y, P.x, P.y) < 300 * 300) killDot(d, "nuke");
      }
      break;
    }
    case "wave": {   // 蓄力后朝移动方向发射冲击波
      G.waveCharge = 0.5;
      SFX.wave();
      break;
    }
    case "missiles": {   // 7 枚追踪导弹
      SFX.missiles();
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        G.missiles.push({ x: P.x, y: P.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 3.5 });
      }
      break;
    }
    case "ice": {    // 冰冻周围
      SFX.ice();
      addRing(P.x, P.y, 200, "#8fd8ff");
      for (const d of G.dots) {
        if (dist2(d.x, d.y, P.x, P.y) < 200 * 200) d.frozen = 5;
      }
      break;
    }
    case "bubble": { // 护盾（已有盾再吃无效）
      if (!G.shield) { G.shield = true; SFX.bubble(); addRing(P.x, P.y, 60, "#5dff9a", 0.4, 3); }
      break;
    }
    case "vortex": { // 放置黑洞（3 秒后激活，吸走红点）
      SFX.vortex();
      const a = Math.atan2(M.active ? M.y - P.y : P.vy, M.active ? M.x - P.x : P.vx);
      G.vortexes.push({
        x: clamp(P.x + Math.cos(a) * 110, 60, W - 60),
        y: clamp(P.y + Math.sin(a) * 110, 60, H - 60),
        countdown: 3, active: false, life: 8,
      });
      break;
    }
    case "spike": {  // 刺球：无敌 + 红点逃跑
      SFX.spike();
      G.invincible = Math.max(G.invincible, 6);
      G.spikeT = 6;
      G.shake = 10;
      break;
    }
    case "lightning": {  // 闪电：连锁电击
      SFX.lightning();
      G.invincible = Math.max(G.invincible, 4);
      G.lightningT = 4;
      G.flash = 0.3;
      break;
    }
    case "burnicade": {  // 烈焰冲刺（先 0.8 秒瞄准）
      SFX.burn();
      G.burnState = { t: 0.8, aim: true };
      break;
    }
    case "turret": {  // 炮塔
      SFX.turret();
      G.invincible = Math.max(G.invincible, 6);
      G.turretT = 6;
      break;
    }
  }
}

// 烈焰冲刺的"点火"阶段
function fireBurnicade() {
  const dir = M.active ? Math.atan2(M.y - P.y, M.x - P.x)
              : (Math.hypot(P.vx, P.vy) > 30 ? Math.atan2(P.vy, P.vx) : 0);
  G.burnState = { t: 1.1, aim: false, dir };
  G.shake = 12;
}

// ---------------- 主更新逻辑 ----------------
function update(dt) {
  G.time += dt;
  // 连击计时：窗口结束 → 结算连击分 n×n×6
  if (G.comboTimer > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) {
      const bonus = G.combo * G.combo * 6;
      if (G.combo >= 5) addFloat(W / 2, H * 0.3, `COMBO x${G.combo}  +${bonus}`, "#ffd98a", 30);
      G.score += bonus;
      G.combo = 0;
    }
  }

  // --- 玩家物理：鼠标 = 倾斜方向 ---
  let accX = 0, accY = 0;
  if (M.active) {
    const dx = M.x - P.x, dy = M.y - P.y, d = Math.hypot(dx, dy);
    if (d > 1) {
      const nx = dx / d, ny = dy / d;
      accX = nx * CFG.playerAccel; accY = ny * CFG.playerAccel;
      // 靠近鼠标时刹车（像磁铁吸住，避免抖动）
      if (d < CFG.mouseStopDist) {
        const k = (1 - d / CFG.mouseStopDist) * 2600;
        accX -= nx * k; accY -= ny * k;
      }
    }
  } else {
    // 鼠标移出窗口：保持最后方向持续加速（模拟持续倾斜）
    accX = G._lastDirX * CFG.playerAccel * 0.8;
    accY = G._lastDirY * CFG.playerAccel * 0.8;
  }
  P.vx += accX * dt; P.vy += accY * dt;
  // 阻尼 + 限速
  const damp = Math.exp(-CFG.playerDamping * dt);
  P.vx *= damp; P.vy *= damp;
  const sp = Math.hypot(P.vx, P.vy);
  if (sp > CFG.playerMaxSpeed) { P.vx = P.vx / sp * CFG.playerMaxSpeed; P.vy = P.vy / sp * CFG.playerMaxSpeed; }
  P.x += P.vx * dt; P.y += P.vy * dt;
  // 撞边反弹（保留一点弹性，手感更"滑"）
  const m = 16;
  if (P.x < m) { P.x = m; P.vx = Math.abs(P.vx) * 0.6; }
  if (P.x > W - m) { P.x = W - m; P.vx = -Math.abs(P.vx) * 0.6; }
  if (P.y < m) { P.y = m; P.vy = Math.abs(P.vy) * 0.6; }
  if (P.y > H - m) { P.y = H - m; P.vy = -Math.abs(P.vy) * 0.6; }
  // 记录朝向（供鼠标移出时使用）
  if (Math.hypot(P.vx, P.vy) > 40) {
    G._lastDirX = P.vx / Math.hypot(P.vx, P.vy);
    G._lastDirY = P.vy / Math.hypot(P.vx, P.vy);
  }

  // --- 烈焰冲刺状态 ---
  if (G.burnState) {
    const bs = G.burnState;
    bs.t -= dt;
    if (bs.aim) {
      if (bs.t <= 0) fireBurnicade();
    } else {
      // 冲刺：高速前进 + 身后留火墙
      P.vx = Math.cos(bs.dir) * 950; P.vy = Math.sin(bs.dir) * 950;
      G.walls.push({ x: P.x, y: P.y, life: 4, r: 18 });
      for (const d of [...G.dots]) {
        if (dist2(d.x, d.y, P.x, P.y) < 80 * 80) killDot(d, "burn");
      }
      if (bs.t <= 0) G.burnState = null;
    }
  }
  // 冲击波蓄力
  if (G.waveCharge > 0) {
    G.waveCharge -= dt;
    P.vx *= 0.6; P.vy *= 0.6;   // 蓄力时减速
    if (G.waveCharge <= 0) {
      // 朝当前移动方向（或鼠标方向）发射冲击波
      let a;
      if (Math.hypot(P.vx, P.vy) > 30) a = Math.atan2(P.vy, P.vx);
      else if (M.active) a = Math.atan2(M.y - P.y, M.x - P.x);
      else a = G._lastDirX ? Math.atan2(G._lastDirY, G._lastDirX) : 0;
      const s = { x: P.x + Math.cos(a) * 30, y: P.y + Math.sin(a) * 30, vx: Math.cos(a) * 720, vy: Math.sin(a) * 720, life: 0.9, r: 34 };
      G.missiles.push({ ...s, wave: true });   // 复用导弹数组，wave 标记
      SFX.wave();
    }
  }

  // --- 武器持续效果 ---
  G.spikeT = Math.max(0, G.spikeT - dt);
  G.lightningT = Math.max(0, G.lightningT - dt);
  G.turretT = Math.max(0, G.turretT - dt);
  G.invincible = Math.max(0, G.invincible - dt);

  // 炮塔射击
  if (G.turretT > 0) {
    G.turretFire -= dt;
    if (G.turretFire <= 0) {
      G.turretFire = 0.12;
      const a = M.active ? Math.atan2(M.y - P.y, M.x - P.x)
                : (G._lastDirX ? Math.atan2(G._lastDirY, G._lastDirX) : 0);
      G.bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640, life: 1.6 });
      SFX.turret();
    }
  }

  // 闪电：周期性放电
  if (G.lightningT > 0) {
    G.lightningTick -= dt;
    if (G.lightningTick <= 0) {
      G.lightningTick = 0.28;
      // 随机电 4 个附近的红点，被电的会连锁传电
      const near = G.dots.filter(d => dist2(d.x, d.y, P.x, P.y) < 190 * 190);
      for (let i = 0; i < 4 && near.length; i++) {
        const d = near.splice(randInt(0, near.length - 1), 1)[0];
        d.shocked = 0.4;
        if (G.dots.includes(d)) killDot(d, "lightning");
        // 连锁：传给 90px 内的其他红点
        for (const o of [...G.dots]) {
          if (dist2(o.x, o.y, d.x, d.y) < 90 * 90) {
            o.shocked = 0.4;
            if (G.dots.includes(o)) killDot(o, "lightning");
          }
        }
      }
      SFX.lightning();
    }
  }

  // --- 红点更新：追踪玩家 + 互碰分离 ---
  const flee = G.spikeT > 0;   // 刺球期间红点逃跑
  for (const d of G.dots) {
    if (d.frozen > 0) { d.frozen -= dt; continue; }   // 冰冻中
    if (d.shocked > 0) { d.shocked -= dt; continue; } // 电击闪烁中
    const dx = P.x - d.x, dy = P.y - d.y;
    const dl = Math.hypot(dx, dy) || 1;
    const spd = d.speed * (flee ? -1.15 : 1);         // 逃跑时反向移动
    const wob = Math.sin(G.time * 3 + d.wobble) * 0.35;
    d.x += (dx / dl + wob * (-dy / dl)) * spd * dt;
    d.y += (dy / dl - wob * (dx / dl)) * spd * dt;
    // 红点之间互碰分离（避免叠成一团）
  }
  // 分离（O(n²)，早退优化）
  for (let i = 0; i < G.dots.length; i++) {
    const a = G.dots[i];
    for (let j = i + 1; j < G.dots.length; j++) {
      const b = G.dots[j];
      const rr = a.r + b.r, dx = b.x - a.x, dy = b.y - a.y;
      const d2v = dx * dx + dy * dy;
      if (d2v < rr * rr && d2v > 0.01) {
        const d = Math.sqrt(d2v), push = (rr - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }
  // 碰撞判定：红点碰到箭头 → 护盾/无敌/死亡
  for (const d of G.dots) {
    if (dist2(d.x, d.y, P.x, P.y) < (d.r + CFG.playerRadius) * (d.r + CFG.playerRadius)) {
      if (G.shield) {          // 护盾挡下并爆炸
        G.shield = false;
        G.shake = 18; G.flash = 0.4;
        addRing(P.x, P.y, 220, "#5dff9a");
        SFX.bubble(); SFX.nuke();
        for (const o of [...G.dots]) if (dist2(o.x, o.y, P.x, P.y) < 220 * 220) killDot(o, "shield");
      } else if (G.invincible > 0) {
        if (G.spikeT > 0) killDot(d, "spike");   // 刺球直接碾碎
        else if (d.frozen) killDot(d, "ice");    // 冰雕撞碎
      } else {
        die();
        return;
      }
    }
  }

  // --- 绿点收集 ---
  for (let i = G.greensList.length - 1; i >= 0; i--) {
    const gp = G.greensList[i];
    if (dist2(gp.x, gp.y, P.x, P.y) < CFG.greenCollectDist * CFG.greenCollectDist) {
      G.greensList.splice(i, 1);
      G.greens++; G.score++;
      burst(gp.x, gp.y, 6, "#7dffa0", 160);
      SFX.green();
      checkUnlock();
    }
  }
  while (G.greensList.length < CFG.greenTarget) spawnGreen();

  // --- 武器球收集 ---
  for (let i = G.orbs.length - 1; i >= 0; i--) {
    const ob = G.orbs[i];
    if (dist2(ob.x, ob.y, P.x, P.y) < CFG.orbCollectDist * CFG.orbCollectDist) {
      G.orbs.splice(i, 1);
      useWeapon(ob.id);
      setTimeout(() => { if (G.state === "playing") spawnOrb(randomOrbId()); }, 800);
    }
  }
  if (G.orbs.length < CFG.orbCount) spawnOrb(randomOrbId());

  // --- 导弹 / 冲击波 / 炮塔子弹 ---
  for (let i = G.missiles.length - 1; i >= 0; i--) {
    const ms = G.missiles[i];
    ms.life -= dt;
    let dead = false;
    if (ms.wave) {   // 冲击波：直线前进，路径上杀红点
      ms.x += ms.vx * dt; ms.y += ms.vy * dt;
      for (const d of [...G.dots]) {
        if (dist2(d.x, d.y, ms.x, ms.y) < 46 * 46) killDot(d, "wave");
      }
    } else {   // 追踪导弹
      let tx = ms.x + ms.vx, ty = ms.y + ms.vy, best = 1e18;
      for (const d of G.dots) {
        const dd = dist2(d.x, d.y, ms.x, ms.y);
        if (dd < best) { best = dd; tx = d.x; ty = d.y; }
      }
      const a = Math.atan2(ty - ms.y, tx - ms.x);
      const sp = Math.hypot(ms.vx, ms.vy);
      ms.vx = Math.cos(a) * sp; ms.vy = Math.sin(a) * sp;
      ms.x += ms.vx * dt; ms.y += ms.vy * dt;
      // 命中判定
      for (const d of [...G.dots]) {
        if (dist2(d.x, d.y, ms.x, ms.y) < (d.r + 8) * (d.r + 8)) {
          killDot(d, "missile");
          addRing(ms.x, ms.y, 80, "#ff9a6b", 0.3, 4);
          dead = true;
          break;
        }
      }
    }
    if (dead || ms.life <= 0) G.missiles.splice(i, 1);
  }
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    let hit = false;
    for (const d of G.dots) {
      if (dist2(d.x, d.y, b.x, b.y) < (d.r + 6) * (d.r + 6)) {
        killDot(d, "turret");
        addRing(b.x, b.y, 70, "#7db2ff", 0.25, 3);
        hit = true; break;
      }
    }
    if (hit || b.life <= 0) G.bullets.splice(i, 1);
  }

  // --- 漩涡（黑洞）---
  for (let i = G.vortexes.length - 1; i >= 0; i--) {
    const v = G.vortexes[i];
    if (v.countdown > 0) { v.countdown -= dt; continue; }
    v.active = true; v.life -= dt;
    // 吸入红点（也轻微吸玩家）
    for (let j = G.dots.length - 1; j >= 0; j--) {
      const d = G.dots[j];
      const dx = v.x - d.x, dy = v.y - d.y, dl = Math.hypot(dx, dy) || 1;
      if (dl < 300) {
        const pull = 420 * (1 - dl / 300);
        d.x += (dx / dl) * pull * dt; d.y += (dy / dl) * pull * dt;
        if (dl < 26) { G.dots.splice(j, 1); burst(v.x, v.y, 5, "#b48cff", 180); G.score += 10; SFX.kill(); }
      }
    }
    const pdx = v.x - P.x, pdy = v.y - P.y, pdl = Math.hypot(pdx, pdy) || 1;
    if (pdl < 260 && pdl > 60) { P.x += (pdx / pdl) * 90 * dt; P.y += (pdy / pdl) * 90 * dt; }
    if (v.life <= 0) G.vortexes.splice(i, 1);
  }

  // --- 火墙 ---
  for (let i = G.walls.length - 1; i >= 0; i--) {
    const wl = G.walls[i];
    wl.life -= dt;
    for (const d of [...G.dots]) {
      if (dist2(d.x, d.y, wl.x, wl.y) < (wl.r + d.r) * (wl.r + d.r)) killDot(d, "burn");
    }
    if (wl.life <= 0) G.walls.splice(i, 1);
  }

  // --- 难度生成：红点生成率随时间提高 ---
  G.spawnAcc += Math.min(CFG.spawnRateBase + G.time * CFG.spawnRateRamp, CFG.spawnRateMax) * dt;
  while (G.spawnAcc >= 1) {
    G.spawnAcc -= 1;
    let type = "normal";
    if (G.time > CFG.bigDotAt && Math.random() < 0.12) type = "big";
    else if (G.time > CFG.fastDotAt && Math.random() < 0.2) type = "fast";
    spawnDot(type);
  }

  // --- 特效衰减 ---
  G.shake *= Math.exp(-6 * dt);
  G.flash = Math.max(0, G.flash - dt * 1.6);
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const rg = G.rings[i];
    rg.life -= dt;
    rg.r += (rg.maxR - rg.r) * Math.min(1, 9 * dt);
    if (rg.life <= 0) G.rings.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    f.life -= dt; f.y -= 40 * dt;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
}

// 检查武器解锁（绿点累计）
function checkUnlock() {
  const next = G.nextWeapon;
  if (next && G.greens >= next.need) {
    G.unlocked.add(next.id);
    SFX.unlock();
    addFloat(W / 2, H * 0.25, `🔓 解锁武器：${next.name}！`, "#ffd98a", 24);
    burst(W / 2, H * 0.25 + 30, 24, "#ffd98a", 300);
    const idx = UNLOCKS.indexOf(next);
    G.nextWeapon = idx < UNLOCKS.length - 1 ? UNLOCKS[idx + 1] : null;
  }
}

// 最高分读写（localStorage 在部分浏览器 file:// 下可能抛异常，包一层保险）
function loadBest() { try { return Number(localStorage.getItem("ttl_best") || 0); } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem("ttl_best", v); } catch (e) { /* 忽略 */ } }

// ---------------- 死亡 ----------------
function die() {
  G.state = "dying";
  G.redFlash = 0;
  SFX.death();
  G.shake = 30;
  burst(P.x, P.y, 50, "#ff5555", 480);
  addRing(P.x, P.y, 200, "#ff5555");
  // 结算连击
  if (G.combo > 0) G.score += G.combo * G.combo * 6;
  G.comboBest = Math.max(G.comboBest, G.combo);
  if (G.score > G.best) { G.best = G.score; saveBest(G.best); }
  // 等一下再显示结算面板（红闪演出）
  setTimeout(showGameOver, 900);
}
function showGameOver() {
  if (G.state !== "dying") return;   // 防止重开后旧回调覆盖新局
  G.state = "over";
  document.getElementById("finalScore").textContent = G.score.toLocaleString();
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  document.getElementById("finalTime").textContent = `${m}:${String(s).padStart(2, "0")}`;
  document.getElementById("finalCombo").textContent = "x" + G.comboBest;
  document.getElementById("finalGreens").textContent = G.greens;
  const his = document.getElementById("finalHis");
  his.textContent = `最高分：${G.best.toLocaleString()}` + (G.score >= G.best && G.score > 0 ? "  🏆 新纪录！" : "");
  // 段子式成就（致敬原版 46 个 Award Challenges）
  let ach = "";
  if (G.time < 5) ach = "😅 你连 5 秒都没撑过 —— 我们同情你。";
  else if (G.comboBest >= 200) ach = "🏅 难以置信的连击！你…通关了？！";
  else if (G.comboBest >= 42) ach = "🌌 42，是生命、宇宙以及一切的答案。";
  else if (G.comboBest >= 20) ach = "✨ 连击大师！红点们对你心生敬畏。";
  else if (G.time >= 60) ach = "⏱ 坚持超过 1 分钟，红点军团的噩梦。";
  document.getElementById("finalAch").textContent = ach;
  document.getElementById("gameover").classList.remove("hidden");
}

// ---------------- 开始新一局 ----------------
function startGame() {
  // 重置所有状态
  G.state = "playing";
  G.time = 0; G.score = 0; G.greens = 0;
  G.combo = 0; G.comboBest = 0; G.comboTimer = 0;
  G.shield = false; G.invincible = 0;
  G.spikeT = 0; G.lightningT = 0; G.turretT = 0;
  G.burnState = null; G.waveCharge = 0;
  G.shake = 0; G.flash = 0; G.redFlash = 0;
  G.dots = []; G.greensList = []; G.orbs = [];
  G.particles = []; G.rings = []; G.missiles = []; G.bullets = [];
  G.vortexes = []; G.walls = []; G.floats = [];
  G.spawnAcc = 0; G.turretFire = 0; G.lightningTick = 0;
  G.unlocked = new Set(STARTER_ORBS);
  G.nextWeapon = UNLOCKS[0];
  G.best = loadBest();
  P.x = W / 2; P.y = H / 2; P.vx = 0; P.vy = 0;
  for (let i = 0; i < CFG.greenTarget; i++) spawnGreen();
  for (let i = 0; i < CFG.orbCount; i++) spawnOrb(randomOrbId());
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
}

// ---------------- 渲染 ----------------
function draw() {
  ctx.save();
  // 屏幕震动
  if (G.shake > 0.5) {
    ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
  }

  // 背景：深蓝渐变（原版极简风）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0b1033");
  bg.addColorStop(0.6, "#101a4a");
  bg.addColorStop(1, "#0a0f2e");
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // 网格线
  ctx.strokeStyle = "rgba(120, 150, 255, 0.07)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 44) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 44) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // 绿点（微微浮动）
  for (const gp of G.greensList) {
    const bob = Math.sin(G.time * 2.4 + gp.phase) * 2;
    ctx.fillStyle = "#6bff9e";
    ctx.shadowColor = "#6bff9e"; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(gp.x, gp.y + bob, gp.r, 0, 6.29);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 武器球（圆底 + 符号 + 浮动）
  for (const ob of G.orbs) {
    const w = WEAPONS[ob.id];
    const bob = Math.sin(G.time * 1.8 + ob.phase) * 4;
    ctx.save();
    ctx.translate(ob.x, ob.y + bob);
    ctx.fillStyle = w.color;
    ctx.shadowColor = w.color; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(0, 0, CFG.orbRadius, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#0b1033";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(w.sym, 0, 1);
    ctx.restore();
  }

  // 红点
  for (const d of G.dots) {
    if (d.frozen > 0) {
      ctx.fillStyle = "#9fd8ff";               // 冰冻：蓝色
      ctx.shadowColor = "#9fd8ff"; ctx.shadowBlur = 10;
    } else if (d.shocked > 0) {
      ctx.fillStyle = "#fff9d9";               // 电击：闪白
      ctx.shadowColor = "#ffea8a"; ctx.shadowBlur = 14;
    } else {
      ctx.fillStyle = d.type === "big" ? "#9aa2b8" : "#ff5252";
      ctx.shadowColor = d.type === "big" ? "#9aa2b8" : "#ff5252";
      ctx.shadowBlur = d.type === "big" ? 6 : 12;
    }
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 火墙
  for (const wl of G.walls) {
    const g2 = ctx.createRadialGradient(wl.x, wl.y, 2, wl.x, wl.y, wl.r);
    g2.addColorStop(0, "rgba(255,180,80,0.9)");
    g2.addColorStop(1, "rgba(255,90,30,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(wl.x, wl.y, wl.r * 2, 0, 6.29); ctx.fill();
  }

  // 漩涡（黑洞）
  for (const v of G.vortexes) {
    ctx.save();
    ctx.translate(v.x, v.y);
    if (!v.active) {
      // 倒计时：半透明紫色，数字显示
      ctx.fillStyle = "rgba(138,93,255,0.35)";
      ctx.beginPath(); ctx.arc(0, 0, 34, 0, 6.29); ctx.fill();
      ctx.fillStyle = "#c9b4ff";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(Math.ceil(v.countdown), 0, 1);
    } else {
      const pulse = 30 + Math.sin(G.time * 9) * 4;
      const g3 = ctx.createRadialGradient(0, 0, 2, 0, 0, pulse);
      g3.addColorStop(0, "rgba(20,10,50,0.95)");
      g3.addColorStop(0.7, "rgba(110,70,220,0.5)");
      g3.addColorStop(1, "rgba(138,93,255,0)");
      ctx.fillStyle = g3;
      ctx.beginPath(); ctx.arc(0, 0, pulse, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  // 导弹与冲击波
  for (const ms of G.missiles) {
    if (ms.wave) {
      const g4 = ctx.createRadialGradient(ms.x, ms.y, 4, ms.x, ms.y, ms.r);
      g4.addColorStop(0, "rgba(200,160,255,0.9)");
      g4.addColorStop(1, "rgba(160,100,255,0)");
      ctx.fillStyle = g4;
      ctx.beginPath(); ctx.arc(ms.x, ms.y, ms.r, 0, 6.29); ctx.fill();
    } else {
      const a = Math.atan2(ms.vy, ms.vx);
      ctx.save();
      ctx.translate(ms.x, ms.y); ctx.rotate(a);
      ctx.fillStyle = "#ffb0b0";
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(-6, -4); ctx.lineTo(-2, 0); ctx.lineTo(-6, 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // 炮塔子弹
  ctx.fillStyle = "#8fb8ff";
  for (const b of G.bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 6.29); ctx.fill();
  }

  // 玩家：护盾光圈 / 刺球 / 闪电圈 / 炮塔
  if (G.shield) {
    ctx.strokeStyle = "rgba(93,255,154,0.85)";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#5dff9a"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(P.x, P.y, 26, 0, 6.29); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if (G.spikeT > 0) {
    // 刺球：外圈尖刺旋转
    ctx.save();
    ctx.translate(P.x, P.y);
    const blink = G.spikeT < 1.2 ? (Math.floor(G.time * 6) % 2 === 0 ? 0.5 : 1) : 1;  // 快结束时闪红
    ctx.rotate(G.time * 6);
    ctx.fillStyle = `rgba(74,106,255,${blink})`;
    ctx.strokeStyle = `rgba(160,180,255,${blink})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * Math.PI * 2;
      const r1 = k % 2 ? 16 : 26;
      ctx[k ? "lineTo" : "moveTo"](Math.cos(a) * r1, Math.sin(a) * r1);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (G.lightningT > 0) {
    // 闪电期间：玩家周围电弧
    ctx.strokeStyle = "rgba(255,250,200,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, 22, 0, 6.29); ctx.stroke();
    for (let k = 0; k < 4; k++) {
      const a = G.time * 10 + k * 1.6;
      const x1 = P.x + Math.cos(a) * 24, y1 = P.y + Math.sin(a) * 24;
      const x2 = P.x + Math.cos(a + 0.5) * 40, y2 = P.y + Math.sin(a + 0.5) * 40;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo((x1 + x2) / 2 + rand(-6, 6), (y1 + y2) / 2 + rand(-6, 6));
      ctx.lineTo(x2, y2); ctx.stroke();
    }
  } else if (G.turretT > 0) {
    // 炮塔形态
    const a = M.active ? Math.atan2(M.y - P.y, M.x - P.x) : 0;
    ctx.save();
    ctx.translate(P.x, P.y); ctx.rotate(a);
    ctx.fillStyle = "#5d9aff";
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#1a2a6c";
    ctx.fillRect(4, -6, 16, 12);
    ctx.restore();
  }
  // 箭头本体（带尾焰/蓄力指示）
  drawArrow();

  // 冲击波圆环
  for (const rg of G.rings) {
    const alpha = clamp(rg.life / rg.maxLife, 0, 1);
    ctx.strokeStyle = rg.color;
    ctx.globalAlpha = alpha * 0.9;
    ctx.lineWidth = rg.width * alpha + 1;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 粒子
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 飘字
  for (const f of G.floats) {
    ctx.globalAlpha = clamp(f.life / f.maxLife, 0, 1);
    ctx.fillStyle = f.color;
    ctx.font = `bold ${f.size}px "Segoe UI", sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // 蓄力指示（冲击波）
  if (G.waveCharge > 0) {
    const prog = 1 - G.waveCharge / 0.5;
    ctx.strokeStyle = "rgba(200,160,255,0.8)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, 26 + prog * 14, 0, 6.29); ctx.stroke();
  }
  // 烈焰瞄准指示
  if (G.burnState && G.burnState.aim) {
    const a = M.active ? Math.atan2(M.y - P.y, M.x - P.x) : 0;
    ctx.save();
    ctx.translate(P.x, P.y); ctx.rotate(a);
    ctx.fillStyle = `rgba(255,150,60,${0.4 + 0.4 * Math.sin(G.time * 14)})`;
    ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(-14, -16); ctx.lineTo(-6, 0); ctx.lineTo(-14, 16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  // --- HUD ---
  if (G.state === "playing" || G.state === "dying") {
    drawHUD();
  }

  // 白闪 / 红闪
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.state === "dying") {
    G.redFlash = Math.min(1, G.redFlash + 0.03);
    ctx.fillStyle = `rgba(180,20,30,${G.redFlash * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// 箭头绘制：尖头朝运动方向，带一点尾光
function drawArrow() {
  const sp = Math.hypot(P.vx, P.vy);
  const a = sp > 20 ? Math.atan2(P.vy, P.vx)
          : (M.active ? Math.atan2(M.y - P.y, M.x - P.x)
          : (G._lastDirX ? Math.atan2(G._lastDirY, G._lastDirX) : 0));
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(a);
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(160,190,255,0.9)"; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(16, 0);            // 尖
  ctx.lineTo(-9, -7);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-9, 7);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = "top";
  // 左上：分数
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.font = "bold 34px 'Segoe UI', sans-serif";
  ctx.fillText(G.score.toLocaleString(), 18, 14);
  // 连击（大字 + 颜色渐变）
  if (G.combo >= 2) {
    ctx.fillStyle = G.combo >= 50 ? "#ffd98a" : G.combo >= 20 ? "#b4ff9e" : "#8fd8ff";
    ctx.font = `bold ${clamp(22 + G.combo * 0.15, 22, 42)}px 'Segoe UI', sans-serif`;
    ctx.fillText(`x${G.combo}`, 20, 54);
  }
  // 右上：时间
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(200,215,255,0.75)";
  ctx.font = "18px 'Segoe UI', sans-serif";
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${String(s).padStart(2, "0")}`, W - 18, 16);
  // 底部：武器解锁进度条
  ctx.textAlign = "left";
  const next = G.nextWeapon;
  ctx.font = "13px 'Segoe UI', sans-serif";
  ctx.fillStyle = "rgba(200,215,255,0.8)";
  const label = next ? `下一武器：${next.name}（${G.greens}/${next.need} 绿点）` : "全部武器已解锁！";
  ctx.fillText(label, 18, H - 34);
  const bw = 200, bh = 8, bx = 18, by = H - 22;
  const prog = next ? Math.min(1, G.greens / next.need) : 1;
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = "#6bff9e";
  ctx.fillRect(bx, by, bw * prog, bh);
  // 武器球数量提示（右上角下）
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,190,120,0.85)";
  ctx.font = "15px 'Segoe UI', sans-serif";
  ctx.fillText("🛰 武器球在场 " + G.orbs.length, W - 18, H - 30);
}

// ---------------- 输入 ----------------
window.addEventListener("mousemove", (e) => {
  M.x = e.clientX; M.y = e.clientY; M.active = true;
});
window.addEventListener("mouseleave", () => { M.active = false; });
window.addEventListener("mousedown", () => {
  if (G.state === "menu" || G.state === "over") {
    startGame();
    if (ac()) ac().resume();
  }
});
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "r") startGame();
  if (k === "m") toggleMute();
  if (k === "p" && (G.state === "playing")) G.state = "paused";
  else if (k === "p" && G.state === "paused") G.state = "playing";
  if ((k === "enter" || k === " ") && (G.state === "menu" || G.state === "over")) startGame();
});
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("retryBtn").addEventListener("click", startGame);
document.getElementById("muteBtn").addEventListener("click", toggleMute);
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem("ttl_muted", muted ? "1" : "0"); } catch (e) { /* 忽略 */ }
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
}

// ---------------- 主循环 ----------------
let lastT = performance.now();
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.033);   // 防止切窗口后物理大跳

  if (G.state === "playing") update(dt);
  draw();

  requestAnimationFrame(loop);
}

// ---------------- 启动 ----------------
G.best = loadBest();
document.getElementById("menuHis").textContent = G.best > 0 ? `最高分：${G.best.toLocaleString()}` : "暂无记录，创造历史吧！";
document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
requestAnimationFrame(loop);
</script>
</body>
